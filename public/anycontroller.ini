switch_positional_layout = 1
back_button_action = touchpad

[DualSense]
dualsense_bt_mode = 1
dualsense_lightbar_mode = 1
dualsense_lightbar_color = 0
dualsense_brightness = 0
dualsense_trigger_mode = 0
dualsense_player_leds = 0
dualsense_mute_action = 0
dualsense_speaker_volume = 80

[DualShock4]
ds4_lightbar_mode = 1
ds4_lightbar_color = 0
ds4_brightness = 0
ds4_rumble_boost = 0
ds4_touchpad_mode = 0
ds4_gyro_deadband = 0
